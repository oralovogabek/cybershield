<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — CyberShield</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="logo">
          <div class="logo-icon">🛡️</div>
          <span>CyberShield</span>
        </a>
        <h1 data-i18n="auth.loginTitle">Hisobingizga kiring</h1>
        <p data-i18n="auth.loginSubtitle">CyberShield platformasiga xush kelibsiz</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" data-i18n="auth.username">Foydalanuvchi nomi</label>
          <input type="text" class="form-input" id="username" name="username" required autocomplete="username" placeholder="ali">
        </div>

        <div class="form-group">
          <label class="form-label" data-i18n="auth.password">Parol</label>
          <div class="input-wrapper">
            <input type="password" class="form-input" id="password" name="password" required autocomplete="current-password" placeholder="••••••">
            <button type="button" class="toggle-password" data-toggle-password aria-label="Show password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div id="loginError" class="form-error hidden"></div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 8px;" data-i18n="auth.loginBtn">
          Kirish
        </button>
      </form>

      <div class="auth-footer">
        <span data-i18n="auth.noAccount">Hisobingiz yo'qmi?</span>
        <a href="register.html" data-i18n="nav.register">Ro'yxatdan o'tish</a>
      </div>

      <div class="flex justify-center gap-3 mt-6">
        <select class="lang-select" data-lang-select>
          <option value="uz">UZ</option>
          <option value="en">EN</option>
          <option value="ru">RU</option>
        </select>
        <button class="icon-btn" data-theme-toggle aria-label="Toggle theme"></button>
      </div>
    </div>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/language.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Redirect if already logged in
      if (Auth.isLoggedIn()) {
        window.location.href = 'pages/dashboard.html';
        return;
      }

      const form = document.getElementById('loginForm');
      const errorEl = document.getElementById('loginError');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.classList.add('hidden');

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;

        const btn = form.querySelector('button[type="submit"]');
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner" style="width:18px;height:18px;border-width:2px;"></span>';

        const result = await Auth.login(username, password);

        btn.disabled = false;
        btn.textContent = originalText;

        if (result.success) {
          Toast.success('Welcome, ' + result.user.username + '!');
          setTimeout(() => {
            window.location.href = 'pages/dashboard.html';
          }, 600);
        } else {
          errorEl.textContent = result.error;
          errorEl.classList.remove('hidden');
          Toast.error(result.error);
        }
      });
    });
  </script>
</body>
</html>
