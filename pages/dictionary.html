<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dictionary — CyberShield</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .page { padding-top: 90px; padding-bottom: 60px; }
    .term-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 12px; }
    .term-card h3 { font-size: 1.1rem; margin-bottom: 6px; }
    .term-trans { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="../index.html" class="logo"><div class="logo-icon">🛡️</div><span>CyberShield</span></a>
      <div class="nav-actions">
        <input type="search" class="form-input" id="search" placeholder="Search terms..." style="width:220px;">
        <select class="lang-select" data-lang-select><option value="uz">UZ</option><option value="en">EN</option><option value="ru">RU</option></select>
        <button class="icon-btn" data-theme-toggle></button>
        <a href="dashboard.html" class="btn btn-outline btn-sm">Dashboard</a>
      </div>
    </div>
  </nav>
  <div class="page"><div class="container" style="max-width:800px;">
    <h1 style="font-size:1.8rem;margin-bottom:8px;">📖 Cyber Dictionary</h1>
    <p class="text-muted mb-6">English terms with Uzbek & Russian translations.</p>
    <div id="list"></div>
  </div></div>
  <script src="../js/storage.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/language.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
  <script>
    let terms = [];
    document.addEventListener('DOMContentLoaded', async () => {
      Theme.init(); Language.init();
      const res = await fetch('../data/dictionary.json');
      terms = (await res.json()).terms.sort((a,b)=>a.term.localeCompare(b.term));
      render(terms);
      document.getElementById('search').oninput = (e) => {
        const q = e.target.value.toLowerCase();
        render(terms.filter(t =>
          t.term.toLowerCase().includes(q) || t.uz.toLowerCase().includes(q) || t.ru.toLowerCase().includes(q) || t.def.toLowerCase().includes(q)
        ));
      };
    });
    function render(list) {
      document.getElementById('list').innerHTML = list.map(t => `
        <div class="term-card">
          <h3>${t.term}</h3>
          <div class="term-trans">🇺🇿 ${t.uz} · 🇷🇺 ${t.ru}</div>
          <p class="text-muted">${t.def}</p>
          <p class="text-sm mt-2" style="color:var(--text-secondary);"><em>Example:</em> ${t.example}</p>
        </div>
      `).join('') || '<p class="text-muted">No terms found.</p>';
    }
  </script>
</body>
</html>
