<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Threats — CyberShield</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <style>
    .page { padding-top: 90px; padding-bottom: 60px; }
    .threats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .threat-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; cursor: pointer; transition: var(--transition); }
    .threat-card:hover { border-color: var(--primary); transform: translateY(-2px); }
    .threat-icon { font-size: 2rem; margin-bottom: 12px; }
    .detail-section { margin-bottom: 24px; }
    .detail-section h3 { margin-bottom: 10px; color: var(--primary); }
    .detail-section ul { margin-left: 20px; }
    .detail-section li { margin-bottom: 6px; color: var(--text-secondary); }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="../index.html" class="logo"><div class="logo-icon">🛡️</div><span>CyberShield</span></a>
      <div class="nav-links">
        <a href="learning.html" class="nav-link">Learning</a>
        <a href="threats.html" class="nav-link active">Threats</a>
        <a href="tools.html" class="nav-link">Tools</a>
        <a href="quiz.html" class="nav-link">Quizzes</a>
      </div>
      <div class="nav-actions">
        <select class="lang-select" data-lang-select><option value="uz">UZ</option><option value="en">EN</option><option value="ru">RU</option></select>
        <button class="icon-btn" data-theme-toggle></button>
        <a href="dashboard.html" class="btn btn-outline btn-sm">Dashboard</a>
      </div>
    </div>
  </nav>

  <div class="page">
    <div class="container">
      <div id="app">
        <h1 style="font-size:1.8rem;margin-bottom:8px;">⚠️ Cyber Threats</h1>
        <p class="text-muted mb-6">Learn about common threats and how to protect yourself.</p>
        <div class="threats-grid" id="grid"></div>
      </div>
    </div>
  </div>

  <script src="../js/storage.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/language.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/main.js"></script>
  <script>
    let threats = [];
    document.addEventListener('DOMContentLoaded', async () => {
      Theme.init();
      await Language.init();
      const res = await fetch('../data/threats.json');
      threats = (await res.json()).threats;
      renderList();
    });

    function renderList() {
      document.getElementById('app').innerHTML = `
        <h1 style="font-size:1.8rem;margin-bottom:8px;">⚠️ Cyber Threats</h1>
        <p class="text-muted mb-6">Learn about common threats and how to protect yourself.</p>
        <div class="threats-grid">
          ${threats.map(t => `
            <div class="threat-card" onclick="showThreat('${t.id}')">
              <div class="threat-icon">${t.icon}</div>
              <h3>${t.title}</h3>
              <p class="text-sm text-muted mt-2">${t.definition.slice(0,100)}...</p>
            </div>
          `).join('')}
        </div>
      `;
    }

    function showThreat(id) {
      const t = threats.find(x => x.id === id);
      if (!t) return;
      document.getElementById('app').innerHTML = `
        <button class="btn btn-outline btn-sm mb-4" onclick="renderList()">← Back</button>
        <div class="card">
          <div class="threat-icon" style="font-size:2.5rem;">${t.icon}</div>
          <h1 style="font-size:1.6rem;margin-bottom:16px;">${t.title}</h1>
          <div class="detail-section"><h3>Definition</h3><p class="text-muted">${t.definition}</p></div>
          <div class="detail-section"><h3>How it works</h3><p class="text-muted">${t.how}</p></div>
          <div class="detail-section"><h3>Warning signs</h3><ul>${t.signs.map(s=>`<li>${s}</li>`).join('')}</ul></div>
          <div class="detail-section"><h3>Prevention</h3><ul>${t.prevention.map(s=>`<li>${s}</li>`).join('')}</ul></div>
          <div class="detail-section"><h3>If affected</h3><ul>${t.ifAffected.map(s=>`<li>${s}</li>`).join('')}</ul></div>
          <a href="quiz.html" class="btn btn-primary mt-4">Take related quiz</a>
        </div>
      `;
    }
    window.showThreat = showThreat;
    window.renderList = renderList;
  </script>
</body>
</html>
